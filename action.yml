name: "GuardLayer Scan"
description: "Free, open-source static security scanner for Next.js + Supabase apps: secrets, RLS, webhooks, Server Action auth."
author: "GuardLayer"
branding:
  icon: "shield"
  color: "green"
inputs:
  fail-on:
    description: "When to fail the build: 'critical' (default), 'warning', or 'never' (report only)."
    required: false
    default: "critical"
outputs:
  score:
    description: "Security score out of 100."
  grade:
    description: "Letter grade A–F."
  critical:
    description: "Number of critical findings."
  warning:
    description: "Number of warning findings."
  findings:
    description: "Total number of findings."
runs:
  using: "node20"
  main: "dist/index.js"
